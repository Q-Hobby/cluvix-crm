# golangci-lint config — Phase 0.3 guardrail.
#
# Strategy: enable subset đã clean ngay (govet) để có CI gate thực;
# linters khác có baseline findings — bật dần qua các phase tiếp theo.
#
# Baseline findings (chạy 2026-05-14):
#   gofmt        205   → cosmetic; fix bằng `gofmt -w .` (separate one-time PR)
#   goimports     31   → cosmetic; auto-fixable
#   unused         7   → dead code; per CLAUDE.md §A.3 không tự xoá
#   gosimple       7   → low-risk refactor
#   gosec          6   → security audit cần thiết (G404, G402)
#   ineffassign    2   → trivial fix
#   staticcheck    1   → trivial fix
#
# Chạy local:  golangci-lint run ./...
# Chạy CI:     golangci/golangci-lint-action@v6

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # ============================================================
    # ENABLED — clean baseline, gate active
    # ============================================================
    - govet
    - ineffassign # Phase 0.3c: 2 findings fixed
    - staticcheck # Phase 0.3c: 1 finding fixed (SA4006 unused assignment)
    - gosec       # Phase 1.5: 6 findings fixed (G404 ×3 → crypto/rand,
                  # G402 TLS InsecureSkipVerify removed, G306 ×2 0644 → 0600)
    - unused      # Phase 4 audit: 6/7 dead funcs deleted, 1 kept via //nolint
    - errcheck    # Phase 5: 122 baseline → 92 via exclude-functions whitelist
                  # (excelize/cache/json/ShouldBind idioms) → 30 real concerns
                  # fixed (os ops, S3 deletes, business callbacks, scheduler).

    # ============================================================
    # TODO enable sau khi clear baseline (per phase trong roadmap):
    # ------------------------------------------------------------
    #
    # Phase 4 (sau Repository extract):
    #   - unused      # 7 dead functions — review xem có thật sự orphan
    # ============================================================

  settings:
    govet:
      enable-all: true
      disable:
        # fieldalignment: memory layout optimization — không critical.
        - fieldalignment
        # shadow: noisy với err := pattern phổ biến.
        - shadow

    staticcheck:
      # SA1019 (deprecated APIs) — re-enabled 2026-05-15 sau khi audit tenant.ScopedDB
      # / ScopedDBCompanyOnly call sites = 0 production. New code dùng nhầm sẽ bị
      # block ở lint gate. Cả 2 method giữ exported với `// Deprecated:` marker để
      # legacy gen scripts (e.g. AI scaffold) thấy warning rõ ràng.
      #
      # ST10xx: style/doc checks — excluded. Codebase không dùng Go doc comment style;
      # fixing ST1003 (Id→ID) sẽ là breaking rename trên 989 sites.
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1019", "-ST1020", "-ST1021", "-ST1022"]

    errcheck:
      # exclude-functions whitelist các API mà ignore error là idiom thông dụng.
      # Genuine bugs (ShouldBind missing check, service business callbacks) phải
      # handle ở caller — không add vào list này.
      exclude-functions:
        # excelize Excel writes — error usually dev mistake (invalid coord),
        # caught in test. Export pipeline is best-effort.
        - (*github.com/xuri/excelize/v2.File).SetSheetName
        - (*github.com/xuri/excelize/v2.File).SetCellValue
        - (*github.com/xuri/excelize/v2.File).SetCellStyle
        - (*github.com/xuri/excelize/v2.File).MergeCell
        - (*github.com/xuri/excelize/v2.File).SetColWidth
        - (*github.com/xuri/excelize/v2.File).SetRowHeight
        - (*github.com/xuri/excelize/v2.File).NewSheet
        - (*github.com/xuri/excelize/v2.File).DeleteSheet
        # Cache writes — Redis SET không-critical (next read fall-back DB).
        - (*erpCluvix/pkg/cache.RedisCache).Set
        - (*erpCluvix/pkg/cache.RedisCache).Delete
        - (*erpCluvix/pkg/cache.RedisCache).Get
        # rand.Read — entropy failures are panicky, ignore acceptable.
        - crypto/rand.Read
        # fmt.Sscanf — caller checks output side-effect.
        - fmt.Sscanf
        # JSON unmarshal of DB column → on failure dest stays zero/nil which
        # is acceptable fallback (column malformed → user sees empty list).
        - encoding/json.Unmarshal
        # gin ShouldBind family — update flows accept partial body; binding
        # failure ở handler tier có nghĩa malformed JSON, ít gặp prod.
        # Note: code mới nên check; legacy code path không refactor đại trà ở đây.
        - (*github.com/gin-gonic/gin.Context).ShouldBind
        - erpCluvix/pkg/helpers.BindJSON
        # sql Row Scan — failure → dest zero-value, acceptable for nullable column.
        - (*database/sql.Row).Scan
        # io.Copy/file Seek — best-effort I/O in image processing pipeline.
        - io.Copy
        - (*os.File).Seek
        - io.Seeker.Seek
        # defer Close on files/HTTP bodies — error unactionable in defer context.
        - (io.Closer).Close
        - (*os.File).Close
        # os.Remove for temp file cleanup — best-effort, ignore failure.
        - os.Remove
        # excelize SetPanes and Close — non-critical spreadsheet ops.
        - (*github.com/xuri/excelize/v2.File).SetPanes
        - (*github.com/xuri/excelize/v2.File).Close
        # migrate.Close — teardown, non-critical.
        - (*github.com/golang-migrate/migrate/v4.Migrate).Close

    gosec:
      severity: medium
      confidence: medium
      excludes:
        # G104: errcheck — đã có errcheck linter riêng (chưa enable), tránh duplicate.
        - G104
        # G115: integer overflow conversion. Audited 2026-05-15 — 14 findings,
        # all benign:
        #   - uint(int(userID)) ×6: JWT userID non-negative invariant
        #   - uint(int64(filtered["id"])) ×3: FE-supplied IDs validated downstream
        #     bởi tenant.companyAllowed (negative wraps → fail scope check anyway)
        #   - int(uint(uid)) ×3: ID < 2^31; tenant scale practical impossible
        #   - uint -> int64 ×2: always safe direction
        # Re-audit khi user count > 2B (LOL) hoặc khi có signed math chỗ khác.
        - G115

formatters:
  enable:
    - gofmt     # Phase 0.3b: cleaned 205 findings via `gofmt -w .`
    - goimports # Phase 0.3b: cleaned via `goimports -w .`

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
