<form [formGroup]="form" novalidate>
  <!-- Context card -->
  <div class="bg-gradient-to-br from-orange-50 to-amber-50 dark:from-surface-800 dark:to-surface-700 p-5 rounded-xl border-2 border-orange-200 dark:border-surface-600 shadow-sm mb-6">
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center w-11 h-11 rounded-xl bg-orange-100 dark:bg-orange-900/30 shrink-0">
        <i class="pi pi-lock text-orange-600 dark:text-orange-400 text-xl"></i>
      </div>
      <div>
        <p class="font-semibold text-gray-800 dark:text-gray-200">{{ 'hr.user_list_page.reset_password_dialog_title' | translate }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">{{ 'hr.user_list_page.reset_password_hint' | translate }}</p>
      </div>
    </div>
  </div>

  <!-- Password section -->
  <div class="bg-white dark:bg-surface-800 p-5 rounded-xl border border-gray-200 dark:border-surface-600 shadow-sm">
    <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-200 dark:border-surface-600">
      <div class="w-8 h-8 rounded-lg bg-purple-50 dark:bg-purple-900/20 flex items-center justify-center">
        <i class="pi pi-shield text-purple-600 dark:text-purple-400"></i>
      </div>
      <h4 class="text-base font-bold text-gray-800 dark:text-gray-200">{{ 'common.label.new_password' | translate }}</h4>
    </div>

    <label for="new-password" class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">
      <i class="pi pi-lock mr-1"></i>{{ 'common.label.new_password' | translate }}
    </label>
    <div class="flex w-full">
      <input
        [class.p-invalid]="passwordControl.invalid"
        class="ng-dirty flex-1 min-w-0 rounded-r-none border-r-0 z-10"
        formControlName="password"
        id="new-password"
        pInputText
        type="text"
        autocomplete="off"
      />
      <button
        (click)="generatePassword()"
        [pTooltip]="'hr.user_form.tooltip_generate' | translate"
        class="px-3 border border-green-500 bg-green-500 hover:bg-green-600 text-white transition-colors"
        tooltipPosition="top"
        type="button"
      >
        <i class="pi pi-refresh"></i>
      </button>
      <button
        [appCopyText]="passwordControl.value"
        [pTooltip]="'common.action.copy' | translate"
        class="px-3 border border-blue-500 bg-blue-500 hover:bg-blue-600 text-white rounded-r-lg transition-colors"
        tooltipPosition="top"
        type="button"
      >
        <i class="pi pi-copy"></i>
      </button>
    </div>
  </div>

  <app-dialog-footer
    [isSubmitting]="isSubmitting()"
    (cancelForm)="dialogRef.close()"
    (saveForm)="onSubmit()"
  />
</form>
