<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12">
      <p-floatlabel variant="on">
        <p-password
          [class.ng-invalid]="isFieldInvalid(rootField.oldpassword!)"
          [feedback]="false"
          [toggleMask]="true"
          [formField]="$any(rootField.oldpassword!)"
          id="oldpassword"
          class="w-full"
        ></p-password>
        <label for="oldpassword">{{ 'hr.change_password.old_password' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12">
      <p-floatlabel variant="on">
        <p-password
          [class.ng-invalid]="isFieldInvalid(rootField.newpassword!)"
          [feedback]="true"
          [toggleMask]="true"
          [formField]="$any(rootField.newpassword!)"
          id="newpassword"
          class="w-full"
        ></p-password>
        <label for="newpassword">{{ 'common.label.new_password' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12">
      <p-floatlabel variant="on">
        <p-password
          [class.ng-invalid]="isFieldInvalid(rootField.newpasswordrepeat!)"
          [feedback]="false"
          [toggleMask]="true"
          [formField]="$any(rootField.newpasswordrepeat!)"
          id="newpasswordrepeat"
          class="w-full"
        ></p-password>
        <label for="newpasswordrepeat">{{ 'hr.change_password.confirm_password' | translate }}</label>
      </p-floatlabel>
    </div>
  </p-fluid>
  <app-dialog-footer [isSubmitting]="isSubmitting()" (cancelForm)="closeForm($event)" (saveForm)="onSubmit()"/>
</form>
