<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12 lg:col-span-4">
      <p-floatlabel variant="on">
        <app-appointment-reason-autocomplete-form-control
          [class.ng-invalid]="isFieldInvalid(rootField.appointment_reason_id!)"
          [formField]="rootField.appointment_reason_id!"
        ></app-appointment-reason-autocomplete-form-control>
        <label for="appointment_reason_id">{{ 'common.label.reason' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12">
      <p-floatlabel variant="on">
      <textarea
        [class.ng-invalid]="isFieldInvalid(rootField.noteAppointment!)"
        class="ng-dirty h-full w-full"
        [rows]="4"
        pTextarea
        [formField]="$any(rootField.noteAppointment!)"
        id="noteAppointment"
      ></textarea>
        <label for="noteAppointment">{{ 'common.label.content' | translate }}</label>
      </p-floatlabel>
    </div>
  </p-fluid>
  <app-dialog-footer [isSubmitting]="isSubmitting()" (cancelForm)="closeForm($event)" (saveForm)="onSubmit()"/>
</form>
