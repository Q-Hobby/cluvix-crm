<div
  [style]="{ width: '100%' }"
  appFillHeight="page"
  class="px-0 pt-0 overflow-auto">

  <div class="card">
    <app-appointment-overview></app-appointment-overview>
  </div>
  <div class="card">
    <p-panel>
      <ng-template #header>
        <div class="flex justify-between flex-wrap w-full">
          <div class="">
            <b>{{ 'common.label.appointment' | translate }}</b>
          </div>
          @if (rfFilterModel) {
            <form [formGroup]="rfFilterModel" novalidate>
              <div class="flex items-center justify-end gap-1">
                <p-floatlabel variant="on">
                  <p-datepicker
                    (onClear)="clearStartTime()"
                    [readonlyInput]="true"
                    appendTo="body"
                    dateFormat="dd/mm/yy"
                    formControlName="_time"
                    id="_time"
                    [placeholder]="'common.label.date' | translate"
                    selectionMode="range"
                    showIcon="true"
                  >
                    <ng-template #footer>
                      <app-date-picker-footer
                        (rangeChange)="onQuickSelectTime($event)"
                      ></app-date-picker-footer>
                    </ng-template>
                  </p-datepicker>
                  <label for="_time">{{ 'common.label.date' | translate }}</label>
                </p-floatlabel>
                <button
                  (click)="resetPage()"
                  type="button" [attr.aria-label]="'common.action.refresh' | translate"
                  [pTooltip]="'common.action.reload_page' | translate"
                  severity="secondary"
                  tooltipPosition="top"
                  [iconOnly]="true"
                  pButton
                ><i class="pi pi-refresh"></i></button>
              </div>
            </form>
          }
        </div>
      </ng-template>
      <div
        [categories]="lineCategories"
        [data]="lineData"
        appLineChart
        class="w-full h-[400px]"
      ></div>
    </p-panel>
  </div>
  <div class="grid grid-cols-12 gap-4">
    <div class="col-span-12">
      <div class="card">
        <p-panel [header]="'crm.report.appointment_chart.month_compare' | translate">
          <app-chart-month></app-chart-month>
        </p-panel>
      </div>
    </div>
  </div>
</div>
