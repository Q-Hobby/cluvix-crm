<form novalidate>
    <div class="grid grid-cols-12 gap-8 pt-4">

      <!-- LEFT SIDE: INSTALLMENT LIST -->
      <div class="col-span-12 lg:col-span-6">
        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm h-full flex flex-col gap-4">

          <!-- INSTALLMENT LISTBOX -->
          <div class="h-[350px]">
            @if (loadingInstallmentList()) {
              <div class="border border-surface rounded-md h-full flex flex-col">
                <div class="p-3 border-b border-surface">
                  <div class="flex items-center gap-2 mb-2">
                    <p-skeleton width="1rem" height="1rem"/>
                    <p-skeleton width="7rem" height="1rem"/>
                  </div>
                  <p-skeleton height="2.5rem"/>
                </div>
                <div class="p-2 flex-1 overflow-hidden">
                  @for (item of [1, 2, 3, 4, 5, 6]; track item) {
                    <div class="flex items-center gap-3 p-2">
                      <p-skeleton width="1rem" height="1rem"/>
                      <p-skeleton width="100%" height="1rem"/>
                    </div>
                  }
                </div>
              </div>
            } @else if (installmentData().length) {
              <p-listbox #installmentList
                         [options]="installmentData()"
                         [checkbox]="true"
                         [multiple]="true"
                         [filter]="true"
                         [virtualScroll]="false"
                         [striped]="true"
                         optionLabel="label"
                         optionValue="value"
                         class="w-full rounded-lg shadow-inner ng-dirty payment-listbox"
                         scrollHeight="290px"
                         [formField]="$any(rootField.installment_idArr!)"
                         (onChange)="changeInstallment(installmentList.value)"
                         [metaKeySelection]="false"
              />
            } @else {
              <div class="border border-surface rounded-md h-full flex items-center justify-center text-gray-500">
                {{ 'crm.payment.form.no_installment' | translate }}
              </div>
            }
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="col-span-12 lg:col-span-6">
        <div class="grid grid-cols-12 gap-6">

          <!-- AMOUNT -->
          <div class="col-span-12 lg:col-span-6">
            <p-floatlabel variant="on">
              <p-inputnumber
                [formField]="$any(rootField.amount!)"
                id="amount"
                [min]="0"
                [disabled]="true"
                class="w-full ng-dirty"
                [class.ng-invalid]="isFieldInvalid(rootField.amount!)"
              ></p-inputnumber>
              <label>{{ 'common.label.amount' | translate }} ({{ 'crm.payment.form.amount_total' | translate: { total: (maxAmount | currencyFormat) } }})</label>
            </p-floatlabel>
          </div>

          <!-- DATE -->
          <div class="col-span-12 lg:col-span-6">
            <p-floatlabel variant="on">
              <p-datepicker
                [formField]="$any(rootField.payment_time!)"
                id="payment_time"
                [minDate]="minPaymentTime"
                [maxDate]="maxPaymentTime"
                [showTime]="true"
                [autofocus]="false"
                appendTo="body"
                dateFormat="dd/mm/yy"
                class="w-full ng-dirty"
                [class.ng-invalid]="isFieldInvalid(rootField.payment_time!)"
              ></p-datepicker>
              <label for="payment_time">{{ 'common.label.collection_date' | translate }}</label>
            </p-floatlabel>
          </div>

          <!-- BRANCH -->
          <div class="col-span-12 lg:col-span-6">
            <p-floatlabel variant="on">
              <app-branch-form-control
                [formField]="$any(rootField.branch_id!)"
                [activeOnly]="true"
                class="w-full ng-dirty"
              ></app-branch-form-control>
              <label>{{ 'common.label.branch' | translate }}</label>
            </p-floatlabel>
          </div>

          <!-- PAYMENT METHOD -->
          <div class="col-span-12 lg:col-span-6">
            <p-floatlabel variant="on">
              <app-payment-method-autocomplete-form-control
                [formField]="$any(rootField.method!)"
                class="w-full ng-dirty"
              ></app-payment-method-autocomplete-form-control>
              <label>{{ 'crm.payment.form.method_installment' | translate }}</label>
            </p-floatlabel>
          </div>

          <!-- PAYMENT TYPE -->
          <div class="col-span-12 lg:col-span-6">
            <p-floatlabel variant="on">
              <app-payment-type-autocomplete-form-control
                [formField]="$any(rootField.card_type_id!)"
                [paymentMethodId]="rootField.method!().value()"
                class="w-full ng-dirty"
              ></app-payment-type-autocomplete-form-control>
              <label>{{ 'crm.payment.form.installment_type' | translate }}</label>
            </p-floatlabel>
          </div>

          <!-- INVOICE -->
          <div class="col-span-12 lg:col-span-6">
            <p-floatlabel variant="on">
              <input pInputText [formField]="$any(rootField.bank_code!)" class="w-full"/>
              <label>{{ 'common.label.invoice' | translate }}</label>
            </p-floatlabel>
          </div>

          <!-- NOTE -->
          <div class="col-span-12">
            <p-floatlabel variant="on">
              <textarea pTextarea rows="4" class="w-full" [formField]="$any(rootField.note!)"></textarea>
              <label>{{ 'common.label.content' | translate }}</label>
            </p-floatlabel>
          </div>

        </div>
      </div>
    </div>

    <app-dialog-footer
      [isSubmitting]="isSubmitting()"
      (cancelForm)="closeForm($event)"
      (saveForm)="checkBeforeSubmit()"
    />
  </form>
