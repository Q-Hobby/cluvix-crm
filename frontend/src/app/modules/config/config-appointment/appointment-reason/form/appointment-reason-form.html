<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12">
      <p-floatlabel variant="on">
        <input
          [autofocus]="true"
          [class.ng-invalid]="isFieldInvalid(rootField.name!)"
          autocomplete="off"
          class="ng-dirty"
          [formField]="rootField.name!"
          id="name"
          pInputText
          type="text"
        />
        <label for="name">{{ 'config.appointment_reason.rejection_reason' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-4">
      <p-floatlabel variant="on">
        <p-inputnumber
          [formField]="rootField.time_nhaclich!"
          id="time_nhaclich"
          [pTooltip]="'config.appointment_reason.reminder_days' | translate"
        ></p-inputnumber>
        <label for="time_nhaclich">{{ 'config.appointment_reason.care_reminder' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 inline-flex items-center gap-2">
      <p-toggleswitch
        [formField]="rootField.status!"
        id="status"
        [trueValue]="1" [falseValue]="0"
      ></p-toggleswitch>
      <label for="status" class="min-w-32">{{ rootField.status!().value() === 1 ? ('common.label.show' | translate) : ('common.label.hide' | translate) }}</label>
    </div>
  </p-fluid>
  <app-dialog-footer [isSubmitting]="isSubmitting()" (cancelForm)="closeForm($event)"
                     (saveForm)="onSubmit()"/>
</form>
