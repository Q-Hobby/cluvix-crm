<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12 lg:col-span-8">
      <p-floatlabel variant="on">
        <input
          [autofocus]="true"
          [class.ng-invalid]="isFieldInvalid(rootField.name!)"
          autocomplete="off"
          class="ng-dirty"
          [formField]="rootField.name!"
          id="name"
          pInputText
          type="text"
        />
        <label for="name">{{ 'common.label.name' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-4">
      <p-floatlabel variant="on">
        <app-payment-method-autocomplete-form-control
          [class.ng-invalid]="isFieldInvalid(rootField.method!)"
          class="ng-dirty"
          [formField]="rootField.method!"
        />
        <label for="method">{{ 'common.label.method' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12">
      <p-floatlabel variant="on">
        <textarea
          [class.ng-invalid]="isFieldInvalid(rootField.note!)"
          [rows]="4"
          pTextarea
          class="ng-dirty w-full"
          [formField]="rootField.note!"
          id="note"
        ></textarea>
        <label for="note">{{ 'common.label.note' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 inline-flex items-center gap-2">
      <p-toggleswitch [formField]="rootField.status!" id="status" [trueValue]="1" [falseValue]="0"></p-toggleswitch>
      <label for="status" class="min-w-32">{{ (rootField.status!().value() === 1 ? 'common.label.visible' : 'common.label.hidden') | translate }}</label>
    </div>
  </p-fluid>
  <app-dialog-footer [isSubmitting]="isSubmitting()" (cancelForm)="closeForm($event)"
                     (saveForm)="onSubmit()"/>
</form>
