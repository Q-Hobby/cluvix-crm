<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <input
          [class.ng-invalid]="isFieldInvalid(rootField.CountryCode!)"
          [formField]="rootField.CountryCode!"
          [pKeyFilter]="blockSpace"
          autocomplete="off"
          id="CountryCode"
          pInputText
          type="text"
        />
        <label for="CountryCode">{{ 'config.location.location_country.code' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <input
          [autofocus]="true"
          [class.ng-invalid]="isFieldInvalid(rootField.CommonName!)"
          [formField]="rootField.CommonName!"
          autocomplete="off"
          class="ng-dirty"
          id="CommonName"
          pInputText
          type="text"
        />
        <label for="CommonName">{{ 'config.location.location_country.common_name' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <input
          [class.ng-invalid]="isFieldInvalid(rootField.FormalName!)"
          [formField]="rootField.FormalName!"
          autocomplete="off"
          id="FormalName"
          pInputText
          type="text"
        />
        <label for="FormalName">{{ 'config.location.location_country.formal_name' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <input
          [class.ng-invalid]="isFieldInvalid(rootField.Capital!)"
          [formField]="rootField.Capital!"
          autocomplete="off"
          id="Capital"
          pInputText
          type="text"
        />
        <label for="Capital">{{ 'config.location.location_country.capital' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <input
          [class.ng-invalid]="isFieldInvalid(rootField.TelephoneCode!)"
          [formField]="rootField.TelephoneCode!"
          autocomplete="off"
          id="TelephoneCode"
          pInputText
          type="text"
        />
        <label for="TelephoneCode">{{ 'config.location.location_country.telephone_code' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <input
          [class.ng-invalid]="isFieldInvalid(rootField.CurrencyCode!)"
          [formField]="rootField.CurrencyCode!"
          [pKeyFilter]="blockSpace"
          autocomplete="off"
          id="CurrencyCode"
          pInputText
          type="text"
        />
        <label for="CurrencyCode">{{ 'config.location.location_country.currency_code' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <input
          [class.ng-invalid]="isFieldInvalid(rootField.CurrencyName!)"
          [formField]="rootField.CurrencyName!"
          autocomplete="off"
          id="CurrencyName"
          pInputText
          type="text"
        />
        <label for="CurrencyName">{{ 'common.label.currency' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 inline-flex items-center gap-2">
      <p-toggleswitch
        [formField]="rootField.status!"
        id="status"
        [trueValue]="1" [falseValue]="0"
      ></p-toggleswitch>
      <label for="status" class="min-w-32">{{ (rootField.status!().value() === 1 ? 'common.label.visible' : 'common.label.hidden') | translate }}</label>
    </div>
  </p-fluid>
  <app-dialog-footer [isSubmitting]="isSubmitting()" (cancelForm)="closeForm($event)"
                     (saveForm)="onSubmit()"/>
</form>
