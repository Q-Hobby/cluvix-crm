<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <customer-ranks-autocomplete-form-control
          [class.ng-invalid]="isFieldInvalid(rootField.rank_id!)"
          class="ng-dirty"
          [formField]="rootField.rank_id!"
        ></customer-ranks-autocomplete-form-control>
        <label for="name">{{ 'common.label.member_rank' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <p-inputnumber
          [class.ng-invalid]="isFieldInvalid(rootField.discount_percent!)"
          class="ng-dirty"
          [formField]="rootField.discount_percent!"
          id="discount_percent"
          [min]="0"
          [max]="100"
          suffix="%"
        ></p-inputnumber>
        <label for="discount_percent">{{ 'common.label.discount_percent_2' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12">
      @if (isLoadingServices) {
        <!-- Loading Skeleton -->
        <div class="skeleton-container">
          <div class="skeleton-list">
            <div class="skeleton-header"></div>
            @for (item of [1, 2, 3, 4, 5, 6, 7, 8]; track $index) {
              <div class="skeleton-item"></div>
            }
          </div>
          <div class="skeleton-buttons">
            <div class="skeleton-button"></div>
            <div class="skeleton-button"></div>
            <div class="skeleton-button"></div>
            <div class="skeleton-button"></div>
          </div>
          <div class="skeleton-list">
            <div class="skeleton-header"></div>
            @for (item of [1, 2, 3]; track $index) {
              <div class="skeleton-item"></div>
            }
          </div>
        </div>
      } @else {
        <!-- Actual PickList -->
        <p-picklist
          [source]="availableServices"
          [target]="selectedServices"
          [dragdrop]="true"
          [responsive]="true"
          [showSourceControls]="true"
          [showTargetControls]="true"
          filterBy="name"
          [showSourceFilter]="true"
          [showTargetFilter]="true"
          [sourceFilterPlaceholder]="'config.customer_rank_services.search_available' | translate"
          [targetFilterPlaceholder]="'config.customer_rank_services.search_selected' | translate"
          [sourceStyle]="{'height': '500px'}"
          [targetStyle]="{'height': '500px'}"
          [scrollHeight]="'430px'"
          [trackBy]="trackByServiceId"
          (onMoveToTarget)="onMoveToTarget($event)"
          (onMoveToSource)="onMoveToSource($event)"
          (onMoveAllToTarget)="onMoveAllToTarget($event)"
          (onMoveAllToSource)="onMoveAllToSource($event)"
          class="custom-picklist"
        >
          <ng-template let-service #item>
            <div class=" items-center justify-between rounded-lg transition-colors">
              <span class="font-medium text-gray-900">{{ service.code || 'N/A' }}</span> - {{ service.name }}
            </div>
          </ng-template>
        </p-picklist>
      }
      <small
        class="text-red-500 mt-1 block transition-opacity duration-200"
        [class.opacity-0]="!isFieldInvalid(rootField.service_ids!)"
        [class.opacity-100]="isFieldInvalid(rootField.service_ids!)"
      >
        {{ 'config.customer_rank_services.select_at_least_one' | translate }}
      </small>
    </div>
  </p-fluid>
  <app-dialog-footer
    [isSubmitting]="isSubmitting()"
    (cancelForm)="closeForm($event)"
    (saveForm)="onSubmit()"
  />
</form>
