<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12 lg:col-span-8">
      <p-floatlabel variant="on">
        <input
          [autofocus]="true"
          [class.ng-invalid]="isFieldInvalid(rootField.name!)"
          [formField]="rootField.name!"
          autocomplete="off"
          class="ng-dirty"
          id="name"
          pInputText
          type="text"
        />
        <label for="name">{{ 'common.label.template_name' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-4">
      <p-floatlabel variant="on">
        <p-select
          appendTo="body"
          [class.ng-invalid]="isFieldInvalid(rootField.type_id!)"
          [options]="NOTE_TEMPLATE_TYPE_OPTIONS"
          [resetFilterOnHide]="true"
          [showClear]="true"
          class="ng-dirty"
          emptyFilterMessage="{{ 'common.message.no_data' | translate }}"
          [emptyFilterMessage]="'common.label.no_results' | translate"
          [formField]="rootField.type_id!"
          id="type_id"
          inputId="type_id"
          optionLabel="label"
          optionValue="value"
        ></p-select>
        <label for="type_id">{{ 'common.label.template_type' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12">
      <label for="content">{{ 'config.note_template.content' | translate }}</label>
      <p-editor [style]="{ height: '300px' }" id="content" [formField]="rootField.content!"></p-editor>
    </div>
    <div class="col-span-12 lg:col-span-6 inline-flex items-center">
      <p-toggleswitch
        [formField]="rootField.status!"
        id="status"
        [trueValue]="1" [falseValue]="0"
      ></p-toggleswitch>
      <label for="status" class="min-w-32">{{ (rootField.status!().value() === 1 ? 'common.label.show' : 'common.label.hide') | translate }}</label>
    </div>
  </p-fluid>
  <app-dialog-footer [isSubmitting]="isSubmitting()" (cancelForm)="closeForm($event)"
                     (saveForm)="onSubmit()"/>
</form>
