<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12">
      <p-floatlabel variant="on">
        <input
          [autofocus]="true"
          [class.ng-invalid]="isFieldInvalid(rootField.name!)"
          autocomplete="off"
          class="ng-dirty"
          [formField]="rootField.name!"
          id="name"
          pInputText
          type="text"
        />
        <label for="name">{{ 'common.label.department' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12">
      <p-floatlabel variant="on">
      <textarea
        [class.ng-invalid]="isFieldInvalid($any(rootField.desc!))"
        [rows]="4"
        pTextarea
        class="ng-dirty w-full"
        [formField]="$any(rootField.desc!)"
        id="desc"
      ></textarea>
        <label for="desc">{{ 'common.label.description' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12">
      <p-floatlabel variant="on">
        <app-user-form-control
          class="ng-dirty"
          [formField]="$any(rootField.head_user_id!)"
        ></app-user-form-control>
        <label for="head_user_id">{{ 'hr.department.head_user_id' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 inline-flex items-center gap-2">
      <p-toggleswitch
        [formField]="rootField.status!"
        id="status"
        [trueValue]="1" [falseValue]="0"
      ></p-toggleswitch>
      <label for="status" class="min-w-32">{{ rootField.status!().value() === 1 ? ('common.label.show' | translate) : ('common.label.hide' | translate) }}</label>
    </div>
  </p-fluid>
  <app-dialog-footer [isSubmitting]="isSubmitting()" (cancelForm)="closeForm($event)"
                     (saveForm)="onSubmit()"/>
</form>
