<form novalidate>
  <p-fluid class="grid grid-cols-12 gap-6 flex-wrap p-fluid pt-2">
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <input
          [autofocus]="true"
          [class.ng-invalid]="isFieldInvalid(rootField.name!)"
          autocomplete="off"
          class="ng-dirty"
          [formField]="rootField.name!"
          id="name"
          pInputText
          type="text"
        />
        <label for="name">{{ 'config.unit.unit_name' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 lg:col-span-6">
      <p-floatlabel variant="on">
        <p-select [multiple]="true"
          [class.ng-invalid]="isFieldInvalid(rootField.categoryId!)"
          [options]="UNIT_CATEGORY_OPTIONS"
          appendTo="body"
          class="ng-dirty"
          [formField]="$any(rootField.categoryId!)"
          id="categoryId"
          inputId="categoryId"
        ></p-select>
        <label for="categoryId">{{ 'common.label.unit_category' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12">
      <p-floatlabel variant="on">
      <textarea
        [class.ng-invalid]="isFieldInvalid(rootField.description!)"
        [rows]="2"
        class="ng-dirty w-full"
        [formField]="rootField.description!"
        id="description"
        pTextarea
      ></textarea>
        <label for="description">{{ 'common.label.detailed_description' | translate }}</label>
      </p-floatlabel>
    </div>
    <div class="col-span-12 inline-flex items-center gap-2">
      <p-toggleswitch [formField]="rootField.status!" id="status" [trueValue]="1" [falseValue]="0"></p-toggleswitch>
      <label for="status" class="min-w-32">{{ (rootField.status!().value() === 1 ? 'common.label.visible' : 'common.label.hidden') | translate }}</label>
    </div>
  </p-fluid>
  <app-dialog-footer [isSubmitting]="isSubmitting()" (cancelForm)="closeForm($event)"
                     (saveForm)="onSubmit()"/>
</form>
